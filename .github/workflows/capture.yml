name: capture-thumbnails
on:
  push:
    branches: [thumbs-capture]
    paths: ['tools/capture.mjs', '.github/workflows/capture.yml']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm i --no-save playwright@1.48.0 && npx playwright install --with-deps chromium
      - run: node tools/capture.mjs
      - run: |
          git config user.name "thumbnail-capture"
          git config user.email "noreply@github.com"
          git add -f shots
          git commit -m "capture" || true
          git push
